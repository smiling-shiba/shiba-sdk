name: Publish to npm

# Manual trigger: create a GitHub Release (tag it to match package.json's version,
# e.g. v0.1.0) and this publishes @smiling-shiba/sdk at that version. Trusted
# publishing (OIDC) must already be configured for this package on npmjs.com,
# pointing at this repo and this workflow file — no npm token is stored here.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Fail fast and clearly if the release tag and package.json disagree,
      # instead of a confusing "cannot publish over existing version" from npm
      # (or, worse, silently publishing the wrong version).
      - name: Verify the release tag matches package.json's version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $pkg_version. Bump the version (npm version <patch|minor|major>) and push before tagging a release."
            exit 1
          fi
          echo "Release tag $RELEASE_TAG matches package.json version $pkg_version."

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm CLI 11.5.1+; make sure the runner has it
      # regardless of exactly which Node 24 patch setup-node picked.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: npm publish
